<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Check | 우리들의 약속</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --main-pink: #f06292; --bg-pink: #fce4ec; }
        body { background-color: var(--bg-pink); font-family: 'Apple SD Gothic Neo', sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .receipt { width: 100%; max-width: 420px; background: white; border: 2px solid var(--main-pink); padding: 25px; box-shadow: 10px 10px 0px rgba(240,98,146,0.1); }
        .header { text-align: center; border-bottom: 2px dashed var(--main-pink); margin-bottom: 20px; padding-bottom: 15px; }
        .header h1 { color: var(--main-pink); font-family: 'Georgia', serif; margin: 0; }
        
        .step { display: none; }
        .step.active { display: block; }
        
        /* 대시보드 프로필 스타일 */
        .profile-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .profile-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .profile-circle { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 3px solid transparent; }
        .profile-name { margin-top: 8px; font-size: 12px; color: #555; font-weight: bold; }
        .done-mark { font-size: 10px; color: var(--main-pink); margin-top: 2px; visibility: hidden; }
        .is-done .done-mark { visibility: visible; }
        .is-done .profile-circle { border-color: var(--main-pink); }
        .add-btn { background: #eee; color: #888; border: 2px dashed #ccc; font-size: 30px; }
        
        .section-title { font-weight: bold; color: var(--main-pink); margin: 20px 0 10px; display: block; font-size: 14px; }
        input, button { width: 100%; padding: 12px; border-radius: 5px; box-sizing: border-box; }
        input { border: 1px solid #ddd; }
        button { background: var(--main-pink); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        
        .time-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 8px; }
        .time-item { border: 1px solid #ddd; padding: 5px; text-align: center; font-size: 11px; cursor: pointer; border-radius: 3px; background: white; }
        .time-item.selected { background: var(--main-pink); color: white; border-color: var(--main-pink); }

        .match-box { background: #fff5f8; padding: 15px; border-radius: 8px; border: 1px solid #f8bbd0; margin-top: 20px; font-size: 13px; }
        .copy-btn { background: #555; font-size: 11px; padding: 5px 10px; width: auto; margin-top: 10px; }
    </style>
</head>
<body>

<div class="receipt">
    <div class="header">
        <h1>Guest Check</h1>
        <small id="room-id-display">ROOM: LOADING...</small>
    </div>

    <div id="step-home" class="step active">
        <span class="section-title">Who's Coming?</span>
        <div class="profile-container" id="profileDashboard">
            <div class="profile-item" onclick="showStep('step-add-profile')">
                <div class="profile-circle add-btn">+</div>
                <span class="profile-name">추가하기</span>
            </div>
        </div>
        <div id="matchResult" class="match-box">로딩 중...</div>
        <button id="copyBtn" class="copy-btn" onclick="copyToClipboard()" style="display:none;">결과 복사하기 📋</button>
    </div>

    <div id="step-add-profile" class="step">
        <span class="section-title">새 프로필 추가</span>
        <input type="text" id="newUserName" placeholder="친구 이름을 입력하세요">
        <span class="section-title">컬러 선택</span>
        <input type="color" id="newUserColor" value="#f06292" style="height: 50px; padding: 2px;">
        <button onclick="addNewProfile()">프로필 저장</button>
        <button onclick="showStep('step-home')" style="background:#aaa;">취소</button>
    </div>

    <div id="step-edit-time" class="step">
        <span class="section-title"><span id="editingName" style="color:var(--main-pink)"></span>님의 일정</span>
        <div id="calendar-inline"></div>
        <div id="timeEditor"></div>
        <button onclick="saveUserTimeToServer()">전체 일정 저장</button>
        <button onclick="showStep('step-home')" style="background:#aaa;">뒤로가기</button>
    </div>
</div>

<script>
    // -------------------------------------------------------------------------
    // [중요] 여기에 본인의 Firebase 설정값을 복사해 넣어야 합니다!
    // -------------------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "여기에_입력",
        authDomain: "여기에_입력",
        databaseURL: "여기에_입력",
        projectId: "여기에_입력",
        storageBucket: "여기에_입력",
        messagingSenderId: "여기에_입력",
        appId: "여기에_입력"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 현재 방 ID 가져오기 (주소창에 ?id=방이름 없으면 랜덤 생성)
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('id');
    if (!roomId) {
        roomId = 'room-' + Math.random().toString(36).substr(2, 9);
        window.history.replaceState({}, '', `${window.location.pathname}?id=${roomId}`);
    }
    document.getElementById('room-id-display').innerText = `ROOM ID: ${roomId}`;

    // -------------------------------------------------------------------------

    let users = []; 
    let currentEditingId = null;
    let tempDates = [];

    // 서버에서 실시간으로 데이터 불러오기
    database.ref('rooms/' + roomId).on('value', (snapshot) => {
        const data = snapshot.val();
        users = data ? Object.values(data) : [];
        renderDashboard();
    });

    function addNewProfile() {
        const name = document.getElementById('newUserName').value;
        const color = document.getElementById('newUserColor').value;
        if(!name) return alert("이름을 입력하세요!");

        const newId = Date.now();
        database.ref('rooms/' + roomId + '/' + newId).set({
            id: newId, name, color, availability: {}, isDone: false
        });
        
        document.getElementById('newUserName').value = "";
        showStep('step-home');
    }

    function renderDashboard() {
        const board = document.getElementById('profileDashboard');
        board.innerHTML = users.map(u => `
            <div class="profile-item ${u.isDone ? 'is-done' : ''}" onclick="startEditTime(${u.id})">
                <div class="profile-circle" style="background:${u.color}">${u.name[0]}</div>
                <span class="profile-name">${u.name}</span>
                <span class="done-mark">● 완료</span>
            </div>
        `).join('') + `
            <div class="profile-item" onclick="showStep('step-add-profile')">
                <div class="profile-circle add-btn">+</div>
                <span class="profile-name">추가하기</span>
            </div>
        `;
        calculateMatches();
    }

    function startEditTime(id) {
        currentEditingId = id;
        const user = users.find(u => u.id === id);
        document.getElementById('editingName').innerText = user.name;
        document.getElementById('timeEditor').innerHTML = ""; 
        fp.clear();
        showStep('step-edit-time');
    }

    const fp = flatpickr("#calendar-inline", {
        inline: true, mode: "multiple", locale: "ko",
        onChange: (dates) => {
            tempDates = dates.map(d => d.toISOString().split('T')[0]);
            renderTimeGrid();
        }
    });

    function renderTimeGrid() {
        const container = document.getElementById('timeEditor');
        container.innerHTML = tempDates.map(date => `
            <div style="margin-top:10px; border:1px solid #eee; padding:10px;">
                <span style="font-size:12px; font-weight:bold;">${date}</span>
                <div class="time-grid" data-date="${date}">
                    ${Array.from({length: 24}, (_, i) => `
                        <div class="time-item" onclick="this.classList.toggle('selected')">${String(i).padStart(2, '0')}:00</div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function saveUserTimeToServer() {
        const user = users.find(u => u.id === currentEditingId);
        const avail = {};
        document.querySelectorAll('.time-grid').forEach(grid => {
            const date = grid.dataset.date;
            const selected = [...grid.querySelectorAll('.time-item.selected')].map(el => el.innerText);
            if(selected.length > 0) avail[date] = selected;
        });

        database.ref('rooms/' + roomId + '/' + currentEditingId).update({
            availability: avail,
            isDone: true
        });
        showStep('step-home');
    }

    let lastMatchText = "";
    function calculateMatches() {
        const resultDiv = document.getElementById('matchResult');
        const copyBtn = document.getElementById('copyBtn');
        const doneUsers = users.filter(u => u.isDone);
        
        if(doneUsers.length < 2) {
            resultDiv.innerHTML = "친구가 2명 이상 완료해야 결과가 보입니다.";
            copyBtn.style.display = "none";
            return;
        }

        let matchHtml = "<strong>🌟 BEST MATCH</strong><br>";
        lastMatchText = `📍 [${roomId}] 약속 결과\n`;
        let foundAny = false;
        const allDates = [...new Set(doneUsers.flatMap(u => Object.keys(u.availability || {})))];

        allDates.sort().forEach(date => {
            let common = doneUsers[0].availability[date] || [];
            doneUsers.forEach(u => {
                const uTime = u.availability ? (u.availability[date] || []) : [];
                common = common.filter(t => uTime.includes(t));
            });
            if(common.length > 0) {
                foundAny = true;
                matchHtml += `<br>📅 <b>${date}</b>: ${common.join(', ')}`;
                lastMatchText += `- ${date}: ${common.join(', ')}\n`;
            }
        });

        if(foundAny) {
            resultDiv.innerHTML = matchHtml;
            copyBtn.style.display = "block";
        } else {
            resultDiv.innerHTML = "겹치는 시간이 없어요... 😭";
            copyBtn.style.display = "none";
        }
    }

    function copyToClipboard() {
        navigator.clipboard.writeText(lastMatchText).then(() => {
            alert("결과가 복사되었습니다! 📋");
        });
    }

    function showStep(id) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
